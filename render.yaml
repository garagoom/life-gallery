services:
  - type: web
    name: life-gallery
    runtime: nodejs
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 3001
    healthCheckPath: /api/photos/random?count=1
    disk:
      mountPath: /app/data
      size: 1GB
