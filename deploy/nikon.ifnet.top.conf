map $http_upgrade $nikon_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name nikon.ifnet.top;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nikon_connection_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nikon.ifnet.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nikon.ifnet.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = nikon.ifnet.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name nikon.ifnet.top;
    return 404; # managed by Certbot
}
